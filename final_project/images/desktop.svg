<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 620" width="650" height="620">
  <style>
    .frame { fill: #ffffff; stroke: #000000; stroke-width: 2; }
    .header { fill: #f0f0f0; stroke: #000000; stroke-width: 1.5; }
    .hero { fill: #fafafa; stroke: #000000; stroke-width: 1.5; stroke-dasharray: 4; }
    .box { fill: #ffffff; stroke: #000000; stroke-width: 1.5; }
    .shaded { fill: #eeeeee; stroke: #000000; stroke-width: 1; }
    .text-title { font-family: sans-serif; font-size: 12px; font-weight: bold; fill: #000000; }
    .text-sub { font-family: sans-serif; font-size: 10px; fill: #555555; }
    .line-dark { stroke: #000000; stroke-width: 2; }
    .line-light { stroke: #888888; stroke-width: 1.5; }
  </style>

  <!-- Monitor Frame -->
  <rect class="frame" x="5" y="5" width="640" height="610" rx="8"/>

  <!-- Header & Navigation -->
  <rect class="header" x="20" y="20" width="610" height="50"/>
  <circle cx="45" cy="45" r="14" fill="#cccccc" stroke="#000000"/>
  <text class="text-title" x="70" y="50" font-size="14">TeachHub Portal</text>

  <!-- Horizontal Nav Links -->
  <text class="text-title" x="420" y="50">Home</text>
  <text class="text-title" x="480" y="50">Tutorials</text>
  <text class="text-title" x="560" y="50">Toolkit</text>

  <!-- Hero Banner -->
  <rect class="hero" x="20" y="80" width="610" height="75"/>
  <line x1="20" y1="80" x2="630" y2="155" stroke="#dddddd"/>
  <line x1="630" y1="80" x2="20" y2="155" stroke="#dddddd"/>
  <text class="text-title" x="325" y="122" font-size="14" text-anchor="middle">[ Welcome Banner &amp; Resource Aggregator Overview ]</text>

  <!-- Left Sidebar Section -->
  <!-- Term of the Day Widget -->
  <rect class="shaded" x="20" y="165" width="180" height="150" rx="4"/>
  <text class="text-title" x="30" y="185">Tech Term of the Day</text>
  <text class="text-sub" x="30" y="200">(Wikipedia API)</text>
  <line class="line-light" x1="30" y1="215" x2="180" y2="215"/>
  <line class="line-light" x1="30" y1="230" x2="160" y2="230"/>
  <line class="line-light" x1="30" y1="245" x2="170" y2="245"/>

  <!-- Category Filters Menu -->
  <rect class="box" x="20" y="325" width="180" height="225" rx="4"/>
  <text class="text-title" x="30" y="345">Category Filters</text>
  
  <rect x="30" y="365" width="12" height="12" fill="#000000"/>
  <text class="text-sub" x="50" y="375" font-weight="bold">All Resources</text>

  <rect x="30" y="395" width="12" height="12" fill="#ffffff" stroke="#000000"/>
  <text class="text-sub" x="50" y="405">HTML5 Assets</text>

  <rect x="30" y="425" width="12" height="12" fill="#ffffff" stroke="#000000"/>
  <text class="text-sub" x="50" y="435">CSS3 &amp; Grid</text>

  <rect x="30" y="455" width="12" height="12" fill="#ffffff" stroke="#000000"/>
  <text class="text-sub" x="50" y="465">JavaScript / API</text>

  <!-- Main Resource Grid Container -->
  <rect class="shaded" x="210" y="165" width="420" height="385" rx="4"/>
  <text class="text-title" x="225" y="185">Featured Learning Paths &amp; Resources</text>

  <!-- Grid Card 1 -->
  <rect class="box" x="225" y="200" width="120" height="160" rx="4"/>
  <rect class="shaded" x="235" y="210" width="100" height="65"/>
  <line class="line-dark" x1="235" y1="288" x2="325" y2="288"/>
  <line class="line-light" x1="235" y1="305" x2="305" y2="305"/>

  <!-- Grid Card 2 -->
  <rect class="box" x="360" y="200" width="120" height="160" rx="4"/>
  <rect class="shaded" x="370" y="210" width="100" height="65"/>
  <line class="line-dark" x1="370" y1="288" x2="460" y2="288"/>
  <line class="line-light" x1="370" y1="305" x2="440" y2="305"/>

  <!-- Grid Card 3 -->
  <rect class="box" x="495" y="200" width="120" height="160" rx="4"/>
  <rect class="shaded" x="505" y="210" width="100" height="65"/>
  <line class="line-dark" x1="505" y1="288" x2="595" y2="288"/>
  <line class="line-light" x1="505" y1="305" x2="575" y2="305"/>

  <!-- Grid Card 4 -->
  <rect class="box" x="225" y="375" width="120" height="160" rx="4"/>
  <rect class="shaded" x="235" y="385" width="100" height="65"/>
  <line class="line-dark" x1="235" y1="463" x2="325" y2="463"/>
  <line class="line-light" x1="235" y1="480" x2="305" y2="480"/>

  <!-- Grid Card 5 -->
  <rect class="box" x="360" y="375" width="120" height="160" rx="4"/>
  <rect class="shaded" x="370" y="385" width="100" height="65"/>
  <line class="line-dark" x1="370" y1="463" x2="460" y2="463"/>
  <line class="line-light" x1="370" y1="480" x2="440" y2="480"/>

  <!-- Grid Card 6 -->
  <rect class="box" x="495" y="375" width="120" height="160" rx="4"/>
  <rect class="shaded" x="505" y="385" width="100" height="65"/>
  <line class="line-dark" x1="505" y1="463" x2="595" y2="463"/>
  <line class="line-light" x1="505" y1="480" x2="575" y2="480"/>

  <!-- Footer -->
  <rect class="header" x="20" y="560" width="610" height="40"/>
  <text class="text-sub" x="325" y="584" text-anchor="middle">© 2026 TeachHub Site Plan | Kevin Cross Minchakpu | WDD 231</text>
</svg>
