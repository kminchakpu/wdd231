<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 620" width="320" height="620">
  <style>
    .frame { fill: #ffffff; stroke: #000000; stroke-width: 2; }
    .header { fill: #f0f0f0; stroke: #000000; stroke-width: 1.5; }
    .hero { fill: #fafafa; stroke: #000000; stroke-width: 1.5; stroke-dasharray: 4; }
    .box { fill: #ffffff; stroke: #000000; stroke-width: 1.5; }
    .shaded { fill: #eeeeee; stroke: #000000; stroke-width: 1; }
    .text-title { font-family: sans-serif; font-size: 11px; font-weight: bold; fill: #000000; }
    .text-sub { font-family: sans-serif; font-size: 9px; fill: #555555; }
    .line-dark { stroke: #000000; stroke-width: 2; }
    .line-light { stroke: #888888; stroke-width: 1.5; }
  </style>

  <!-- Phone Frame -->
  <rect class="frame" x="5" y="5" width="310" height="610" rx="12"/>

  <!-- Header & Navigation -->
  <rect class="header" x="15" y="15" width="290" height="40"/>
  <circle cx="35" cy="35" r="10" fill="#cccccc" stroke="#000000"/>
  <text class="text-title" x="52" y="39">TeachHub</text>
  <!-- Hamburger Icon -->
  <line class="line-dark" x1="265" y1="28" x2="290" y2="28"/>
  <line class="line-dark" x1="265" y1="35" x2="290" y2="35"/>
  <line class="line-dark" x1="265" y1="42" x2="290" y2="42"/>

  <!-- Hero Section -->
  <rect class="hero" x="15" y="65" width="290" height="65"/>
  <line x1="15" y1="65" x2="305" y2="130" stroke="#dddddd"/>
  <line x1="305" y1="65" x2="15" y2="130" stroke="#dddddd"/>
  <text class="text-title" x="160" y="98" text-anchor="middle">[ Welcome Dashboard Banner ]</text>

  <!-- Tech Term of the Day Card -->
  <rect class="box" x="15" y="140" width="290" height="75" rx="4"/>
  <text class="text-title" x="25" y="158">Tech Term of the Day</text>
  <text class="text-sub" x="25" y="172">(Dynamic Wikipedia API Definition)</text>
  <line class="line-light" x1="25" y1="185" x2="280" y2="185"/>
  <line class="line-light" x1="25" y1="198" x2="230" y2="198"/>

  <!-- Category Filters -->
  <rect class="shaded" x="15" y="225" width="60" height="25" rx="3"/>
  <text class="text-sub" x="45" y="241" text-anchor="middle">All</text>
  <rect class="box" x="85" y="225" width="60" height="25" rx="3"/>
  <text class="text-sub" x="115" y="241" text-anchor="middle">HTML</text>
  <rect class="box" x="155" y="225" width="60" height="25" rx="3"/>
  <text class="text-sub" x="185" y="241" text-anchor="middle">CSS</text>
  <rect class="box" x="225" y="225" width="60" height="25" rx="3"/>
  <text class="text-sub" x="255" y="241" text-anchor="middle">JS</text>

  <!-- Learning Path Stack (Cards) -->
  <!-- Card 1 -->
  <rect class="box" x="15" y="260" width="290" height="90" rx="4"/>
  <rect class="shaded" x="25" y="270" width="70" height="70"/>
  <line x1="25" y1="270" x2="95" y2="340" stroke="#bbbbbb"/>
  <line x1="95" y1="270" x2="25" y2="340" stroke="#bbbbbb"/>
  <line class="line-dark" x1="105" y1="280" x2="280" y2="280"/>
  <line class="line-light" x1="105" y1="300" x2="250" y2="300"/>
  <line class="line-light" x1="105" y1="320" x2="210" y2="320"/>

  <!-- Card 2 -->
  <rect class="box" x="15" y="360" width="290" height="90" rx="4"/>
  <rect class="shaded" x="25" y="370" width="70" height="70"/>
  <line x1="25" y1="370" x2="95" y2="440" stroke="#bbbbbb"/>
  <line x1="95" y1="370" x2="25" y2="440" stroke="#bbbbbb"/>
  <line class="line-dark" x1="105" y1="380" x2="280" y2="380"/>
  <line class="line-light" x1="105" y1="400" x2="250" y2="400"/>
  <line class="line-light" x1="105" y1="420" x2="210" y2="420"/>

  <!-- Card 3 -->
  <rect class="box" x="15" y="460" width="290" height="90" rx="4"/>
  <rect class="shaded" x="25" y="470" width="70" height="70"/>
  <line x1="25" y1="470" x2="95" y2="540" stroke="#bbbbbb"/>
  <line x1="95" y1="470" x2="25" y2="540" stroke="#bbbbbb"/>
  <line class="line-dark" x1="105" y1="480" x2="280" y2="480"/>
  <line class="line-light" x1="105" y1="500" x2="250" y2="500"/>
  <line class="line-light" x1="105" y1="520" x2="210" y2="520"/>

  <!-- Footer -->
  <rect class="header" x="15" y="560" width="290" height="35"/>
  <text class="text-sub" x="160" y="581" text-anchor="middle">© 2026 TeachHub | Kevin Cross Minchakpu</text>
</svg>
