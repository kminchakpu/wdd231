<body>

<!-- HEADER -->

<header>
    <div class="logo-area">
        <img src="images/logo.webp" alt="TeachHub Logo" class="logo">
        <p>Teach<span>Hub</span></p>
    </div>
    <button type="button" id="menu-toggle" aria-label="Toggle Menu">&#9776;</button>
    <nav id="primary-nav">
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="tutorials.html">Tutorials</a></li>
            <li><a href="toolkit.html" class="active">Student Toolkit</a></li>
        </ul>
    </nav>
</header>

<main>
  <section class="form-container">
    <h2>Submit a Learning Resource</h2>
    <p class="form-description">Recommend high-quality documentation or tutorial videos to be featured on TeachHub.</p>
    
    <form action="thankyou.html" method="get" id="recommendation-form">
      <!-- Hidden Timestamp Field (Populated via JS on submit) -->
      <input type="hidden" id="timestamp" name="timestamp" value="">

      <!-- First Name & Last Name (Side by side on larger screens via flex/grid) -->
      <div class="form-group">
        <label for="fname">First Name:</label>
        <input type="text" id="fname" name="fname" required placeholder="Enter your first name">
      </div>

      <div class="form-group">
        <label for="lastname">Last Name:</label>
        <input type="text" id="lastname" name="lastname" placeholder="Enter your last name">
      </div>

       <div class="form-group">
        <label for="email">Email Address:</label>
        <input type="email" id="email" name="email" required placeholder="name@example.com">
      </div>

      <div class="form-group">
        <label for="phone">Mobile Number:</label>
        <input type="tel" id="phone" name="phone" placeholder="e.g. 123-456-7890">
      </div>

      <div class="form-group">
        <label for="category">Resource Category:</label>
        <select id="category" name="category" required>
          <option value="">Select Category...</option>
          <option value="html">HTML</option>
          <option value="css">CSS</option>
          <option value="javascript">JavaScript</option>
        </select>
      </div>

      <div class="form-group">
        <label for="resource-url">Resource URL:</label>
        <input type="url" id="resource-url" name="url" required placeholder="https://example.com">
      </div>

      <div class="form-group">
        <label for="comments">Why is this resource helpful?</label>
        <textarea id="comments" name="comments" rows="4" placeholder="Share a brief overview..."></textarea>
      </div>

      <button type="submit" class="btn">Submit Recommendation</button>
    </form>
  </section>
</main>

<!-- Footer -->
<footer>
   <p>&copy; <span id="current-year"></span> TeachHub Portal | Kevin Cross Minchakpu | WDD 231 </p>
   <p>Last Modified: <span id="last-modified"></span></p>
   <p><a class="video-demo" href="#" target="_blank" rel="noopener">Video Demonstration</a></p>
</footer>
</body>
</html>
